     <!DOCTYPE html>
<html>
<body>

  <h1>SKU Generator</h1>

  Category:
  <select id="category">
    <option>Perishables</option>
    <option>Non-Perishables</option>
    <option>Beverages</option>
  </select>
  <br><br>

    <h5> Product Name: </h5>
 <form class="d-flex"> 
    <input class="form-control me-2" id="product" placeholder=" Sweet Burger ">
    </form>
<br>
  <h5> Stock Quantity: </h5>
 <form class="d-flex"> 
    <input class="form-control me-2" id="quantity" placeholder=" e.g. 50 ">
    </form>
    <br>
  <button onclick="generate()">Generate SKU</button>

  <p id="result">Your generated SKU will appear here.  ˙ᵕ˙ </p>

  <script>
    function generate() {
      var c = document.getElementById("category").value;
      var p = document.getElementById("product").value;
      var q = document.getElementById("quantity").value;

      var sku = c.substring(0, 3) + "-" + p.substring(0, 3) + "-" + q;
      document.getElementById("result").innerHTML = sku.toUpperCase();
    }
  </script>

</body>
